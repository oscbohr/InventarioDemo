apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-demo
  namespace: inventory
  labels:
    app: inventory-demo
spec:
  # Todas las réplicas comparten la BD del pod h2-server, así que se puede escalar.
  replicas: 1
  selector:
    matchLabels:
      app: inventory-demo
  template:
    metadata:
      labels:
        app: inventory-demo
    spec:
      initContainers:
        - name: esperar-h2
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z h2-server 9092; do echo esperando a h2-server; sleep 2; done"]
      containers:
        - name: inventory-demo
          image: inventory-demo:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: inventory-demo-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: h2-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: h2-credentials
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
