# Valores de ejemplo: cámbialos antes de usar fuera de un entorno de pruebas.
apiVersion: v1
kind: Secret
metadata:
  name: h2-credentials
  namespace: inventory
type: Opaque
stringData:
  username: inventario
  password: "123456"   # entre comillas: si es solo numérico, YAML lo lee como número y el Secret falla
