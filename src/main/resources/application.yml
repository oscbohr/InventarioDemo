spring:
  application:
    name: InventoryDemo
  jpa:
    open-in-view: false
    #show-sql: true
    hibernate:
      ddl-auto: create-drop
      #format_sql: true

logging:
  pattern:
    # Segmento personalizado: [requestId] de la petición (MDC, ver RequestIdFilter); "-" fuera de una petición
    level: "%5p [%X{requestId:--}]"
  level:
    # Nivel de log por defecto para toda la aplicación
    root: INFO

    # Nivel DEBUG para tu paquete principal
    com.inventory: DEBUG

    # (Opcional) Cambiar nivel de frameworks específicos si generan mucho ruido
    org.springframework.web: INFO
    org.hibernate: WARN

# Actuator: solo health, info y metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Configuración inicial de depreciación ()
depreciacion:
  porcentaje: 4
  metodo: LINEA_RECTA   #Metodo de depreciación (LINEA_RECTA o SALDO_DECRECIENTE)